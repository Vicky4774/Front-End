<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Addition of Numbers</title>
</head>
<body>

	<script type="text/javascript">
		
		let sum=0;
		

		for(let num=1;num<=5;num++)
		{
			sum=sum+num;

			console.log(sum); //it will display how all the adddition of number performed.
		}

		// console.log(sum); it will display only total addition of number.
		

	</script>

</body>
</html>
