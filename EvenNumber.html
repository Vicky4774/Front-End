<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Even Number</title>
</head>
<body>

	<script type="text/javascript">
		
		for(let i=1;i<=100;i++)
		{
			if(i%2==0)
			{
				console.log("Even Number",i);
			}


		}



	</script>

</body>
</html>
