<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BasicTask</title>

<style type="text/css">
	
	.main
	{
		width: 50%;
		height: 700px;
		border:2px solid black;
		border-radius: 10px;
	
	}	
	.first
	{

		width: 100%;
		height: 80px;
		background: orange;
		color: black;
		text-align: center;
		border-radius: 10px;
		font-size: 30px;
		line-height:70px ;
		

	}
	.navbar ul
	{
		border: 2px solid red;
		width: 94%;
		height: 70px;
		display: inline-block;
		display: flex;
		background: lightsalmon;
	}
	.navbar li
	{
		list-style-type:none;
		justify-content: center;
		border: 2px solid black;
		padding: 10px;
		text-align: center;
		margin:10px 30px;
		margin-right: 67px;		
		border-radius: 10px;
		background: aquamarine;
	}
	hover:li
	{
		background: red;
	}

</style>


</head>
<body>
<div class="main">
	
	<div class="first">Welcome To CSE</div>
	<div class="navbar">
		
		<ul>
			
				<li>Home</li>
				<li>About</li>
				<li>Contact US</li>
				<li>Gallery</li>

		</ul>


	</div>







</div>



</body>
</html>
