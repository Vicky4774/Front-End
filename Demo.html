<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Even & Odd </title>
</head>
<body>

	<script>

	var number=parseInt(prompt("Enter a number"));

	

	if(number%2==0)
	{
		console.log("Given number is Even");
	}
	else
	{
		console.log("Given number is odd")
	}
</script>

</body>
</html>
